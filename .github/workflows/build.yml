name: Build YoloTouchHelp APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # 直接指定系统环境变量，指向预装的 Android SDK
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    # 1. 拉取源码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 配置 JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. 环境防御性处理（删除可能导致冲突的本地配置，赋予执行权限）
    - name: Prepare Environment
      run: |
        rm -f local.properties
        chmod +x gradlew

    # 4. 手动安装项目所需的 NDK（预装环境不包含 NDK）
    - name: Install Android NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --sdk_root=$ANDROID_HOME \
          "ndk;28.2.13676358"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

    # 5. 预热 Gradle（提前下载依赖，防止超时）
    - name: Warm up Gradle
      run: ./gradlew --version

    # 6. 构建 Debug APK
    - name: Build Debug APK
      run: ./gradlew clean assembleDebug --stacktrace

    # 7. 上传 APK 产物
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: YoloTouchHelp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
