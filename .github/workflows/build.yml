name: Build YoloTouchHelp APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 🛡️ 核心防御：清理本地路径配置，修复 JVM 内存参数，赋予执行权限
    - name: Prepare Environment
      run: |
        # 1. 删除可能存在的本地 SDK 路径配置
        rm -f local.properties
        
        # 2. 删除硬编码的本地 Java 路径
        sed -i '/org.gradle.java.home/d' gradle.properties
        
        # 3. 强制将 JVM 内存限制在 GitHub 容器安全范围内（防止 OOM 崩溃）
        sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8/' gradle.properties
        
        # 4. 赋予 gradlew 执行权限
        chmod +x gradlew
        
        # 5. 打印最终修改后的配置，方便在日志中核对
        echo "---- Current gradle.properties ----"
        cat gradle.properties

    # ⚙️ 安装项目所需的 NDK 和 CMake（避免 Gradle 自动下载超时）
    - name: Install NDK and CMake
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --sdk_root=$ANDROID_HOME \
          "ndk;28.2.13676358" "cmake;3.22.1"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

    # 📦 配置 Gradle 缓存，加速后续构建
    - name: Setup Gradle Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # 🔥 预热 Gradle（提前下载 Gradle 8.11.1 及基础依赖）
    - name: Warm up Gradle
      run: ./gradlew --version

    # 🚀 正式编译 Debug APK
    - name: Build Debug APK
      run: ./gradlew clean assembleDebug --stacktrace

    # 📤 上传最终产物
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: YoloTouchHelp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
