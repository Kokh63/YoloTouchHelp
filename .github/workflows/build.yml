name: Build YoloTouchHelp APK

on:
  workflow_dispatch: # 允许在页面上手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_HOME} "ndk;27.0.12077973" # 使用一个稳定的NDK版本
        echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> $GITHUB_ENV

    - name: Build Release APK
      run: ./gradlew assembleRelease # 尝试构建Release版，如果失败可改为 assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: YoloTouchHelp-APK
        path: app/build/outputs/apk/release/app-release.apk # 如果是Debug版，路径为 app/build/outputs/apk/debug/app-debug.apk
